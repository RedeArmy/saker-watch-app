# The application on top of the datastores of docker-compose.yml: the migrator (a step that runs and ends), the API and the worker, with the memory
# limits the whole stack is meant to live under on the Oracle Always Free host (2 OCPUs and 12 GB, A-009, RFC-0002). Add it with the `app` profile:
#   docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.app.yml --profile app up -d --build
# Variables (deploy/.env, mode 600): POSTGRES_PASSWORD, MONGO_PASSWORD, REDIS_PASSWORD (the bootstrap logins), API_DB_PASSWORD, WORKER_DB_PASSWORD, MONGO_APP_PASSWORD
# (the runtime logins, created once with scripts/dev-create-logins.sh or the secret manager of the host), CLAVARIS_AUTHORITY, CLAVARIS_AUDIENCE, AUDIT_ACTOR_PEPPER.
# Provider settings (TwelveData__ApiKey, MarketData__Providers__Markets__XNAS...) go in deploy/app.env, which is not in the repository (deploy/app.env.example).
# The API is not published: the edge (Caddy, Phase 5) reaches it over the `app` network. The datastores stay on the internal `backend` network; only the API and the
# worker also join `app`, which has the outbound access the providers need.
name: saker-watch
x-hardening: &hardening
  read_only: true
  tmpfs: ["/tmp:size=64m,mode=1777"]
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  pids_limit: 256
services:
  migrator:
    <<: *hardening
    profiles: [app]
    build: { context: .., dockerfile: deploy/Dockerfile, target: migrator }
    image: saker-watch/migrator:${IMAGE_TAG:-local}
    environment:
      ConnectionStrings__PostgresAdmin: Host=postgres;Database=saker;Username=saker_admin;Password=${POSTGRES_PASSWORD:?set in deploy/.env}
      ConnectionStrings__MongoAdmin: mongodb://saker_admin:${MONGO_PASSWORD:?set in deploy/.env}@mongo:27017/?authSource=admin
    depends_on:
      postgres: { condition: service_healthy }
      mongo: { condition: service_healthy }
    networks: [backend]
    restart: "no"
    mem_limit: 256m
    cpus: 1.0
  api:
    <<: *hardening
    profiles: [app]
    build: { context: .., dockerfile: deploy/Dockerfile, target: api }
    image: saker-watch/api:${IMAGE_TAG:-local}
    env_file: [{ path: ./app.env, required: false }]
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Postgres: Host=postgres;Database=saker;Username=saker_api;Password=${API_DB_PASSWORD:?set in deploy/.env}
      ConnectionStrings__Mongo: mongodb://saker_app:${MONGO_APP_PASSWORD:?set in deploy/.env}@mongo:27017/saker
      ConnectionStrings__Redis: redis:6379,password=${REDIS_PASSWORD:?set in deploy/.env}
      Clavaris__Authority: ${CLAVARIS_AUTHORITY:?set in deploy/.env}
      Clavaris__Audience: ${CLAVARIS_AUDIENCE:?set in deploy/.env}
      Audit__ActorPepper: ${AUDIT_ACTOR_PEPPER:?set in deploy/.env}
      ConnectionStrings__PostgresMaxPoolSize: "20"
      Deployment__ApiReplicas: "1"
    depends_on:
      migrator: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    networks: [backend, app]
    # The image has no curl: bash opens the socket itself.
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health/live HTTP/1.0\\r\\n\\r\\n' >&3 && head -n 1 <&3 | grep -q ' 200 '"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    restart: unless-stopped
    mem_limit: 768m
    cpus: 1.0
  worker:
    <<: *hardening
    profiles: [app]
    build: { context: .., dockerfile: deploy/Dockerfile, target: worker }
    image: saker-watch/worker:${IMAGE_TAG:-local}
    env_file: [{ path: ./app.env, required: false }]
    environment:
      DOTNET_ENVIRONMENT: Production
      ConnectionStrings__Postgres: Host=postgres;Database=saker;Username=saker_worker;Password=${WORKER_DB_PASSWORD:?set in deploy/.env}
      ConnectionStrings__Mongo: mongodb://saker_app:${MONGO_APP_PASSWORD:?set in deploy/.env}@mongo:27017/saker
      ConnectionStrings__Redis: redis:6379,password=${REDIS_PASSWORD:?set in deploy/.env}
      Audit__ActorPepper: ${AUDIT_ACTOR_PEPPER:?set in deploy/.env}
      ConnectionStrings__PostgresMaxPoolSize: "20"
      Deployment__ApiReplicas: "1"
    depends_on:
      migrator: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    networks: [backend, app]
    # The worker serves no port; its liveness is the restart policy and the metrics of the jobs (queue depth, oldest age).
    healthcheck: { disable: true }
    restart: unless-stopped
    mem_limit: 768m
    cpus: 1.0
  # Limits of the datastores for the 12 GB host. The values are a first budget to be confirmed by the measurement of scripts/smoke-app-stack.sh on the host itself.
  postgres:
    mem_limit: 2g
    command: ["postgres", "-c", "shared_buffers=512MB", "-c", "max_connections=100", "-c", "work_mem=8MB", "-c", "maintenance_work_mem=128MB"]
  mongo:
    mem_limit: 1g
    # WiredTiger's cache defaults to half of the memory minus 1 GB, measured on the host and not on the container: it has to be capped here.
    command: ["mongod", "--wiredTigerCacheSizeGB", "0.5"]
  redis:
    mem_limit: 256m
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?set in deploy/.env}", "--maxmemory", "160mb", "--maxmemory-policy", "noeviction"]
networks:
  app: {}
