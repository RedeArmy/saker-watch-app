name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
# Every action is pinned to a full commit SHA (the trailing comment is the human-readable tag);
# Dependabot (github-actions ecosystem) proposes SHA bumps.
jobs:
  docs-and-config:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: Docs index
        run: bash scripts/check-docs-index.sh
      - name: TODO discipline
        run: bash scripts/check-todos.sh
      - name: Remote-script pipe scan
        run: |
          pat='(curl|wget)[^;&]*\|&?[[:space:]]*(sudo[[:space:]]+)?(ba|z|da)?sh([[:space:]]|$)|<\([[:space:]]*(curl|wget)|\$\([[:space:]]*(curl|wget)'
          if grep -RInE "$pat" Makefile scripts deploy .github/workflows --exclude=ci.yml; then
            echo "remote-script pipe found"; exit 1
          fi
      - name: Compose config
        run: |
          export POSTGRES_PASSWORD=ci MONGO_PASSWORD=ci REDIS_PASSWORD=ci GRAFANA_ADMIN_PASSWORD=ci
          docker compose -f deploy/docker-compose.yml --profile dev config -q
          docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.obs.yml --profile obs config -q
          # `make up` must not need the Grafana password: the observability file is separate.
          unset GRAFANA_ADMIN_PASSWORD
          docker compose -f deploy/docker-compose.yml --profile dev config -q
          # The fake IdP must exist only behind the dev profile.
          if docker compose -f deploy/docker-compose.yml config --services | grep -q fake-idp; then
            echo "fake-idp is enabled without the dev profile"; exit 1
          fi
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # gitleaks-action lists the PR's commits through the API on pull_request events.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  dotnet:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with: { global-json-file: global.json }
      - run: dotnet restore
      - run: dotnet build --no-restore -warnaserror
      - run: dotnet format --verify-no-changes --no-restore
      - run: dotnet test --no-build
      - name: Vulnerable packages
        run: |
          dotnet list package --vulnerable --include-transitive 2>&1 | tee vuln.txt
          if grep -q "has the following vulnerable packages" vuln.txt; then exit 1; fi
  sonarcloud:
    # Static analysis, coverage, duplication and security hotspots; fails when the Quality Gate fails.
    # Requires the SONAR_TOKEN secret and the SONAR_ORGANIZATION / SONAR_PROJECT_KEY repository variables
    # (docs/runbooks/sonarcloud-setup.md). Fails when the token is missing (also in the Dependabot secret store); skipped only for fork PRs.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with: { global-json-file: global.json }
      # A missing token must fail the job, not skip it (a skipped required check counts as passed).
      # Dependabot runs read the *Dependabot* secret store, so SONAR_TOKEN must exist there too.
      - name: Require SONAR_TOKEN
        if: env.SONAR_TOKEN == '' && github.event.pull_request.head.repo.fork != true
        run: |
          echo "::error::SONAR_TOKEN is not available. Add it under Settings > Secrets and variables > Actions AND > Dependabot."
          exit 1
      - name: Install SonarScanner for .NET
        if: env.SONAR_TOKEN != ''
        run: dotnet tool install --global dotnet-sonarscanner --version 11.3.0
      - name: Begin analysis
        if: env.SONAR_TOKEN != ''
        run: >
          dotnet sonarscanner begin
          /k:"${{ vars.SONAR_PROJECT_KEY }}"
          /o:"${{ vars.SONAR_ORGANIZATION }}"
          /d:sonar.token="$SONAR_TOKEN"
          /d:sonar.host.url="https://sonarcloud.io"
          /d:sonar.cs.opencover.reportsPaths="**/coverage.opencover.xml"
          /d:sonar.coverage.exclusions="**/Program.cs,**/IAssemblyMarker.cs"
          /d:sonar.exclusions="**/bin/**,**/obj/**,**/TestResults/**"
          /d:sonar.qualitygate.wait=true
      - name: Build
        if: env.SONAR_TOKEN != ''
        run: dotnet build --no-incremental -warnaserror
      - name: Test with coverage
        if: env.SONAR_TOKEN != ''
        run: >
          dotnet test --no-build
          --collect:"XPlat Code Coverage"
          -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover
      - name: End analysis (waits for the Quality Gate)
        if: env.SONAR_TOKEN != ''
        run: dotnet sonarscanner end /d:sonar.token="$SONAR_TOKEN"
  codeql:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with: { global-json-file: global.json }
      - uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with: { languages: csharp }
      - run: dotnet build --no-incremental -warnaserror
      # Code scanning (the upload target) needs a public repo or GitHub Advanced Security. On a private repo
      # without it, analyze locally and keep the SARIF as a build artifact instead of failing the job.
      # `upload` only covers the SARIF; the CodeQL database is uploaded separately (`upload-database`) and needs
      # code scanning too, so both are switched off together on a private repo.
      - uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          output: sarif-results
          upload: ${{ github.event.repository.private && 'never' || 'always' }}
          upload-database: ${{ !github.event.repository.private }}
      - name: Keep SARIF results (private repo)
        if: github.event.repository.private
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: codeql-sarif
          path: sarif-results
          retention-days: 14
  trivy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: "1"
  # Planned for phase 1+ (tracked in docs/roadmap.md): coverage gate, SBOM (CycloneDX), multi-arch images (linux/arm64), EF migration bundle, deploy job.
