name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
# Every action is pinned to a full commit SHA (the trailing comment is the human-readable tag);
# Dependabot (github-actions ecosystem) proposes SHA bumps.
jobs:
  docs-and-config:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: Docs index
        run: bash scripts/check-docs-index.sh
      - name: TODO discipline
        run: bash scripts/check-todos.sh
      - name: Ruleset of main requires only checks that exist
        run: python3 -I scripts/check-ruleset.py
      - name: Remote-script pipe scan
        run: |
          pat='(curl|wget)[^;&]*\|&?[[:space:]]*(sudo[[:space:]]+)?(ba|z|da)?sh([[:space:]]|$)|<\([[:space:]]*(curl|wget)|\$\([[:space:]]*(curl|wget)'
          if grep -RInE "$pat" Makefile scripts deploy .github/workflows --exclude=ci.yml; then
            echo "remote-script pipe found"; exit 1
          fi
      - name: Compose config
        run: |
          export POSTGRES_PASSWORD=ci MONGO_PASSWORD=ci REDIS_PASSWORD=ci GRAFANA_ADMIN_PASSWORD=ci
          docker compose -f deploy/docker-compose.yml --profile dev config -q
          docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.obs.yml --profile obs config -q
          # `make up` must not need the Grafana password: the observability file is separate.
          unset GRAFANA_ADMIN_PASSWORD
          docker compose -f deploy/docker-compose.yml --profile dev config -q
          # The application services must be valid with the variables a host sets, and must not publish a port.
          export API_DB_PASSWORD=ci WORKER_DB_PASSWORD=ci MONGO_APP_PASSWORD=ci AUDIT_ACTOR_PEPPER=ci CLAVARIS_AUTHORITY=https://idp.invalid CLAVARIS_AUDIENCE=ci
          docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.app.yml --profile app config -q
          if docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.app.yml --profile app config | grep -E '^\s+published:' | grep -v '8088'; then
            echo "an application service publishes a port"; exit 1
          fi
          # The fake IdP must exist only behind the dev profile.
          if docker compose -f deploy/docker-compose.yml config --services | grep -q fake-idp; then
            echo "fake-idp is enabled without the dev profile"; exit 1
          fi
  api-contract:
    # Contract.Tests (in the dotnet job) already fail when docs/api/openapi.v1.json does not match the code. This job compares the
    # committed contract with the one on the base branch and fails on a breaking change (ADR-0014); additive changes pass.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BASE_REF: ${{ github.base_ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, persist-credentials: false }
      - name: Breaking changes against the base branch
        run: |
          mkdir -p "$RUNNER_TEMP/base"
          if ! git show "origin/${BASE_REF}:docs/api/openapi.v1.json" > "$RUNNER_TEMP/base/openapi.v1.json" 2>/dev/null; then
            echo "The base branch has no committed contract yet; nothing to compare."
            exit 0
          fi
          # tufin/oasdiff v1.33.0, pinned by digest.
          docker run --rm -v "$RUNNER_TEMP/base:/base:ro" -v "$PWD/docs/api:/head:ro" \
            tufin/oasdiff@sha256:6263a96dd2ef0726c54e21fea9b8e1607eac4841add0079324b424c1f52b819c \
            breaking /base/openapi.v1.json /head/openapi.v1.json --fail-on ERR
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # gitleaks-action lists the PR's commits through the API on pull_request events.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  dotnet:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with: { global-json-file: global.json }
      # Restoring the packages is repeated by three jobs; the cache is keyed by everything that decides which packages are needed.
      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Packages.props', 'global.json', 'dotnet-tools.json') }}
          restore-keys: nuget-${{ runner.os }}-
      - run: dotnet restore
      - run: dotnet build --no-restore -warnaserror
      - run: dotnet format --verify-no-changes --no-restore
      - name: Test with coverage
        run: >
          dotnet test --no-build
          --collect:"XPlat Code Coverage"
          --results-directory "$RUNNER_TEMP/coverage"
          --blame-hang --blame-hang-timeout 12m --blame-hang-dump-type none
          -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=cobertura
      # Line coverage of the Domain/Application assemblies must stay at or above 85 % (testing rules); the summary is kept.
      - name: Coverage gate (Domain and Application at least 85 %)
        run: python3 -I scripts/check-coverage.py "$RUNNER_TEMP/coverage" 85 | tee coverage-summary.txt  # the runner's bash uses pipefail, so a failed gate fails the step
      # CycloneDX SBOM of each deployable (production dependencies, direct and transitive).
      - name: SBOM (CycloneDX)
        run: |
          dotnet tool restore
          for host in Api Worker Migrator; do
            dotnet cyclonedx "src/Hosts/Host.${host}/SakerWatch.Hosts.${host}.csproj" -rs -ed -dpr -F Json -fn "${host,,}.bom.json" -o sbom
          done
      - name: Keep coverage summary and SBOMs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-evidence
          path: |
            coverage-summary.txt
            sbom/*.bom.json
          retention-days: 30
      - name: Vulnerable packages
        run: |
          dotnet list package --vulnerable --include-transitive 2>&1 | tee vuln.txt
          if grep -q "has the following vulnerable packages" vuln.txt; then exit 1; fi
  sonarcloud:
    # Static analysis, coverage, duplication and security hotspots; fails when the Quality Gate fails.
    # Requires the SONAR_TOKEN secret and the SONAR_ORGANIZATION / SONAR_PROJECT_KEY repository variables
    # (docs/runbooks/sonarcloud-setup.md). Fails when the token is missing (also in the Dependabot secret store); skipped only for fork PRs.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with: { global-json-file: global.json }
      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Packages.props', 'global.json', 'dotnet-tools.json') }}
          restore-keys: nuget-${{ runner.os }}-
      # A missing token must fail the job, not skip it (a skipped required check counts as passed).
      # Dependabot runs read the *Dependabot* secret store, so SONAR_TOKEN must exist there too.
      - name: Require SONAR_TOKEN
        if: env.SONAR_TOKEN == '' && github.event.pull_request.head.repo.fork != true
        run: |
          echo "::error::SONAR_TOKEN is not available. Add it under Settings > Secrets and variables > Actions AND > Dependabot."
          exit 1
      - name: Install SonarScanner for .NET
        if: env.SONAR_TOKEN != ''
        run: dotnet tool install --global dotnet-sonarscanner --version 11.3.0
      - name: Begin analysis
        if: env.SONAR_TOKEN != ''
        run: >
          dotnet sonarscanner begin
          /k:"${{ vars.SONAR_PROJECT_KEY }}"
          /o:"${{ vars.SONAR_ORGANIZATION }}"
          /d:sonar.token="$SONAR_TOKEN"
          /d:sonar.host.url="https://sonarcloud.io"
          /d:sonar.cs.opencover.reportsPaths="**/coverage.opencover.xml"
          /d:sonar.coverage.exclusions="**/Program.cs,**/IAssemblyMarker.cs,scripts/**,tests/load/**"
          /d:sonar.python.version="3.10,3.11,3.12,3.13,3.14"
          /d:sonar.exclusions="**/bin/**,**/obj/**,**/TestResults/**"
          /d:sonar.cpd.exclusions="**/Migrations/**"
          /d:sonar.qualitygate.wait=true
      - name: Build
        if: env.SONAR_TOKEN != ''
        run: dotnet build --no-incremental -warnaserror
      - name: Test with coverage
        if: env.SONAR_TOKEN != ''
        run: >
          dotnet test --no-build
          --collect:"XPlat Code Coverage"
          --blame-hang --blame-hang-timeout 12m --blame-hang-dump-type none
          -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover
      - name: End analysis (waits for the Quality Gate)
        if: env.SONAR_TOKEN != ''
        run: dotnet sonarscanner end /d:sonar.token="$SONAR_TOKEN"
  codeql:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with: { global-json-file: global.json }
      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Packages.props', 'global.json', 'dotnet-tools.json') }}
          restore-keys: nuget-${{ runner.os }}-
      - uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with: { languages: csharp }
      - run: dotnet build --no-incremental -warnaserror
      # Code scanning (the upload target) needs a public repo or GitHub Advanced Security. On a private repo
      # without it, analyze locally and keep the SARIF as a build artifact instead of failing the job.
      # `upload` only covers the SARIF; the CodeQL database is uploaded separately (`upload-database`) and needs
      # code scanning too, so both are switched off together on a private repo.
      - uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          output: sarif-results
          upload: ${{ github.event.repository.private && 'never' || 'always' }}
          upload-database: ${{ !github.event.repository.private }}
      - name: Keep SARIF results (private repo)
        if: github.event.repository.private
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: codeql-sarif
          path: sarif-results
          retention-days: 14
  trivy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: "1"
  images:
    # The three images of deploy/Dockerfile must build (with the warnings-as-errors build inside) and carry no HIGH or CRITICAL vulnerability that has a fix.
    # Not a required check of the ruleset yet: a base image with a fresh finding should not block unrelated pull requests; Dependabot proposes the new digest.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: Build the images
        run: |
          for target in api worker migrator; do
            docker build -f deploy/Dockerfile --target "$target" -t "saker-watch/$target:ci" .
          done
      - name: Scan the API image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with: { image-ref: "saker-watch/api:ci", scanners: "vuln,secret", severity: "HIGH,CRITICAL", ignore-unfixed: "true", exit-code: "1" }
      - name: Scan the worker image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with: { image-ref: "saker-watch/worker:ci", scanners: "vuln,secret", severity: "HIGH,CRITICAL", ignore-unfixed: "true", exit-code: "1" }
      - name: Scan the migrator image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with: { image-ref: "saker-watch/migrator:ci", scanners: "vuln,secret", severity: "HIGH,CRITICAL", ignore-unfixed: "true", exit-code: "1" }
  # Planned for phase 5 (tracked in docs/roadmap.md): multi-arch images (linux/arm64) pushed to a registry, a signature, and a deploy job.
