# Dev stack. Caddy publishes a port (loopback); datastores live on an internal network.
# Profile `obs` (observability, ADR-0016) additionally publishes Grafana (3000) and the OTLP receiver (4317/4318)
# on loopback so hosts running outside Docker can export telemetry; nothing is reachable from other machines.
# TODO(phase-5): pin image digests (supply-chain requirement) once versions are chosen.
name: saker-watch
services:
  postgres:
    image: timescale/timescaledb:2.30.2-pg16   # multi-arch (amd64+arm64)
    environment:
      # Bootstrap superuser: for migrations/admin ONLY. Phase 1 adds init scripts creating
      # api_role / worker_role (NOSUPERUSER NOBYPASSRLS) so RLS tests are not vacuous.
      POSTGRES_USER: saker_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in deploy/.env}
      POSTGRES_DB: saker
    volumes: [pgdata:/var/lib/postgresql/data]
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saker_admin -d saker"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
  mongo:
    image: mongo:9.0
    environment:
      # Root user for bootstrap only; Phase 1 creates a per-database readWrite user for the app.
      MONGO_INITDB_ROOT_USERNAME: saker_admin
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?set in deploy/.env}
    volumes: [mongodata:/data/db]
    networks: [backend]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "quit(db.adminCommand('ping').ok ? 0 : 1)"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
  redis:
    image: redis:8.10-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?set in deploy/.env}"]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    volumes: [redisdata:/data]
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
  fake-idp:
    # DEV/TEST ONLY OIDC provider. Behind the `dev` profile; must never exist in a deployed compose file.
    profiles: [dev]
    image: ghcr.io/navikt/mock-oauth2-server:6.0.6
    environment:
      SERVER_PORT: "8080"
    networks: [idp]
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
  caddy:
    image: caddy:2.11-alpine
    ports: ["127.0.0.1:8088:80"]
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
    networks: [edge, idp]    # Phase 1 adds an `app` network shared with the API; never `backend`.
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
  otel-collector:
    profiles: [obs]
    image: otel/opentelemetry-collector-contrib:0.162.0
    command: ["--config=/etc/otelcol/config.yaml"]
    ports: ["127.0.0.1:4317:4317", "127.0.0.1:4318:4318"]
    volumes: ["./observability/otel-collector.yaml:/etc/otelcol/config.yaml:ro"]
    networks: [obs, edge]    # edge only provides the loopback-published OTLP ports; backends are reached over obs
    mem_limit: 384m
    cap_drop: [ALL]
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
  tempo:
    profiles: [obs]
    image: grafana/tempo:2.10.8
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./observability/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempodata:/var/tempo
    networks: [obs]
    mem_limit: 512m
    cap_drop: [ALL]
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
  loki:
    profiles: [obs]
    image: grafana/loki:3.7.8
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes:
      - ./observability/loki.yaml:/etc/loki/loki.yaml:ro
      - lokidata:/loki
    networks: [obs]
    mem_limit: 512m
    cap_drop: [ALL]
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
  prometheus:
    profiles: [obs]
    image: prom/prometheus:v3.15.0
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=7d"]
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    networks: [obs]
    mem_limit: 384m
    cap_drop: [ALL]
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
  grafana:
    profiles: [obs]
    image: grafana/grafana:13.2.3
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set in deploy/.env}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    ports: ["127.0.0.1:3000:3000"]
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    networks: [obs, edge]    # edge only provides the published loopback port; obs holds the data sources
    mem_limit: 384m
    cap_drop: [ALL]
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
networks:
  backend:
    internal: true
  idp:
    internal: true
  obs:
    internal: true
  edge: {}
volumes:
  pgdata: {}
  mongodata: {}
  redisdata: {}
  caddydata: {}
  tempodata: {}
  lokidata: {}
  promdata: {}
  grafanadata: {}
